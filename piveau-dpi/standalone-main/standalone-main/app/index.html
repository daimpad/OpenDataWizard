  <script>
    var waitForTrackerCount = 0;
    function matomoWaitForTracker() {
      if (typeof _paq === 'undefined' || typeof Cookiebot === 'undefined') {
        if (waitForTrackerCount < 40) {
          setTimeout(matomoWaitForTracker, 250);
          waitForTrackerCount++;
          return;
        }
      } else {
        window.addEventListener('CookiebotOnAccept', function (e) {
            consentSet();
        });
        window.addEventListener('CookiebotOnDecline', function (e) {
            consentSet();
        })
      }
    }
    function consentSet() {
      if (Cookiebot.consent.statistics) {
        _paq.push(['rememberCookieConsentGiven']);
        _paq.push(['setConsentGiven']);
      } else {
        _paq.push(['forgetCookieConsentGiven']); 
        _paq.push(['deleteCookies']);
      }
    }
    document.addEventListener('DOMContentLoaded', matomoWaitForTracker);
  </script>
  <!-- Matomo -->
  <script>
    var _paq = window._paq = window._paq || [];
    _paq.push(['requireCookieConsent']);
    /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
    _paq.push(["setCookieDomain", ".bydata.de"]);
    _paq.push(["setDomains", [".bydata.de",".open.bydata.de",".opendata.bayern",".opendatabayern.de"]]);
    _paq.push(["enableCrossDomainLinking"]);
    _paq.push(["setExcludedQueryParams", ["mtm_medium","mtm_source","mtm_campaign","mtm_content"]]);

    (function() {
      var u="https://matomo.byte.bayern/";
      _paq.push(['setTrackerUrl', u+'matomo.php']);
      _paq.push(['setSiteId', '1']);
    })();
  </script>
  <script src="https://matomo.byte.bayern/matomo.js" data-cookieconsent="statistics" type="text/plain"></script>
