# Aussprache für die Sprachausgabe (ElevenLabs, Stimme „Damian").
#
# Der Sprechtext im Drehbuch bleibt unverändert, denn er ist zugleich der Untertitel. Ersetzt wird nur
# in dem Text, der an die Stimme geht. Reihenfolge: längere Einträge zuerst.
#
# Noch ohne Eintrag, nach dem ersten Anhören zu entscheiden: JSON-LD, CESSDA.

ersetzungen:
  - text: "de für Deutsch, en für Englisch"   # Sprachkennungen buchstabieren (Folge 3)
    gesprochen: "D E für Deutsch, E N für Englisch"
  - text: "DCAT-AP.de"
    gesprochen: "Dikätäypi Punkt D E"
  - text: "CC BY 4.0"
    gesprochen: "Si si-bei vier Punkt null"
  - text: "DCAT-AP"
    gesprochen: "Dikätäypi"   # englisch ausgesprochen
  - text: " & "   # „Bevölkerung & Gesellschaft" (Folge 8): im Untertitel wie im Bild
    gesprochen: " und "
  - text: "manage_open_data"   # Name der Berechtigung (Folge 10), englisch
    gesprochen: "manage open data"
  - text: "WP-CLI"
    gesprochen: "W P C L I"
  - text: ".zip"
    gesprochen: "Punkt zip"
  - text: "data.europa.eu"
    gesprochen: "data Punkt europa Punkt E U"
