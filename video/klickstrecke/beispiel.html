<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klickstrecken · Testseite</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1d2327; background: #f4f5f6; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 16px; }
  .wahl { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
  .wahl label { display: inline-flex; gap: 8px; align-items: center; }
  select { font: inherit; padding: 4px 8px; }
  odw-klickstrecke { padding: 16px; border-radius: 8px; }
  code { font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1 style="margin:0;font-size:22px">Klickstrecken · Testseite</h1>
  <div class="wahl">
    <label for="folge">Folge <select id="folge"><option value="0">0 · Quick-Start</option><option value="1">1 · Warum Metadaten?</option><option value="2">2 · Installation und Einstellungen</option><option value="3">3 · Das Formular I</option><option value="4">4 · Das Formular II</option></select></label>
    <label for="gestaltung">Gestaltung <select id="gestaltung"><option value="odw">Open Data Wizard</option><option value="datenatlas">Datenatlas Zivilgesellschaft</option></select></label>
  </div>
  <odw-klickstrecke id="ks" src="folge-0/daten.json" gestaltung="odw"></odw-klickstrecke>
  <p>Einbindung auf einer Seite: <code id="schnipsel"></code></p>
</main>
<script type="module" src="odw-klickstrecke.js"></script>
<script type="module">
  const ks = document.getElementById('ks'), f = document.getElementById('folge'), g = document.getElementById('gestaltung');
  // Nur bekannte Werte übernehmen — die Adresszeile darf keine beliebigen Pfade einschleusen.
  const FOLGEN = ['0', '1', '2', '3', '4'], GESTALTUNGEN = ['odw', 'datenatlas'];
  const p = new URLSearchParams(location.search);
  if (FOLGEN.includes(p.get('folge'))) f.value = p.get('folge');
  if (GESTALTUNGEN.includes(p.get('gestaltung'))) g.value = p.get('gestaltung');
  const setze = () => {
    const folge = FOLGEN.includes(f.value) ? f.value : '0';
    const gestaltung = GESTALTUNGEN.includes(g.value) ? g.value : 'odw';
    ks.setAttribute('src', `folge-${folge}/daten.json`);
    ks.setAttribute('gestaltung', gestaltung);
    document.getElementById('schnipsel').textContent = `<odw-klickstrecke src="/fileadmin/odw-tutorials/folge-${folge}/daten.json" gestaltung="${gestaltung}"></odw-klickstrecke>`;
  };
  f.addEventListener('change', setze); g.addEventListener('change', setze); setze();
</script>
</body>
</html>
